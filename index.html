<!DOCTYPE html>

<html lang="en">
<head>
  <meta charset="UTF-8">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 320px;
      min-height: 100vh;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #e0e7ff, #f8fafc, #dbeafe);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #1e293b;
      overflow: hidden;
    }

    /* Main Container */
    body::before {
      content: "";
      position: fixed;
      width: 180px;
      height: 180px;
      background: rgba(37, 99, 235, 0.15);
      border-radius: 50%;
      top: -70px;
      right: -70px;
      filter: blur(5px);
      animation: float 6s ease-in-out infinite;
    }

    body::after {
      content: "";
      position: fixed;
      width: 140px;
      height: 140px;
      background: rgba(99, 102, 241, 0.12);
      border-radius: 50%;
      bottom: -50px;
      left: -50px;
      filter: blur(4px);
      animation: floatReverse 7s ease-in-out infinite;
    }

    /* Make form content appear as one premium card */
    .field,
    button {
      position: relative;
      z-index: 2;
    }

    /* Creating a visual card effect */
    .field:first-child {
      margin-top: 10px;
    }

    /* Card-style background behind content */
    body {
      position: relative;
    }

    body > .field,
    body > button {
      width: 100%;
      max-width: 280px;
    }

    /* Group appearance using fields */
    .field:first-child::before {
      content: "";
      position: absolute;
      z-index: -1;
      top: -28px;
      left: -14px;
      width: calc(100% + 28px);
      height: 210px;
      background: rgba(255, 255, 255, 0.92);
      border: 1px solid rgba(255, 255, 255, 0.8);
      border-radius: 18px;
      box-shadow:
        0 18px 45px rgba(15, 23, 42, 0.15),
        0 4px 12px rgba(37, 99, 235, 0.08);
      backdrop-filter: blur(12px);
      animation: cardEnter 0.7s ease-out;
    }

    .field {
      margin-bottom: 18px;
      animation: fadeUp 0.6s ease forwards;
    }

    .field:nth-child(2) {
      animation-delay: 0.1s;
    }

    label {
      font-size: 12px;
      font-weight: 700;
      display: block;
      margin-bottom: 7px;
      color: #334155;
      letter-spacing: 0.3px;
    }

    input,
    select {
      width: 100%;
      padding: 10px;
      border: 1px solid #d7dee8;
      border-radius: 9px;
      background: #f8fafc;
      color: #334155;
      font-size: 12px;
      outline: none;
      transition: all 0.25s ease;
    }

    input:hover,
    select:hover {
      border-color: #93c5fd;
      background: #ffffff;
    }

    input:focus,
    select:focus {
      border-color: #2563eb;
      background: #ffffff;
      box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.12);
      transform: translateY(-1px);
    }

    /* File Input */
    input[type="file"] {
      cursor: pointer;
      padding: 7px;
    }

    input[type="file"]::file-selector-button {
      border: none;
      background: linear-gradient(135deg, #eff6ff, #dbeafe);
      color: #2563eb;
      padding: 7px 10px;
      border-radius: 6px;
      margin-right: 8px;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.25s ease;
    }

    input[type="file"]::file-selector-button:hover {
      background: #2563eb;
      color: white;
      transform: scale(1.03);
    }

    select {
      cursor: pointer;
    }

    /* Button */
    button {
      padding: 11px;
      margin-top: 5px;
      border: none;
      border-radius: 10px;
      background: linear-gradient(135deg, #2563eb, #4f46e5);
      color: white;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.3px;
      cursor: pointer;
      box-shadow:
        0 8px 20px rgba(37, 99, 235, 0.28);
      transition: all 0.25s ease;
      animation: fadeUp 0.6s ease forwards;
      animation-delay: 0.2s;
      opacity: 0;
    }

    button:hover {
      transform: translateY(-3px);
      box-shadow:
        0 12px 25px rgba(37, 99, 235, 0.35);
    }

    button:active {
      transform: translateY(0);
      box-shadow:
        0 5px 12px rgba(37, 99, 235, 0.25);
    }

    /* Animations */

    @keyframes cardEnter {
      from {
        opacity: 0;
        transform: scale(0.94) translateY(15px);
      }

      to {
        opacity: 1;
        transform: scale(1) translateY(0);
      }
    }

    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(15px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes float {
      0%, 100% {
        transform: translate(0, 0);
      }

      50% {
        transform: translate(-15px, 15px);
      }
    }

    @keyframes floatReverse {
      0%, 100% {
        transform: translate(0, 0);
      }

      50% {
        transform: translate(15px, -12px);
      }
    }
  </style>

</head>

<body>

  <div class="field">
    <label>Select Image</label>
    <input type="file" id="imageInput" accept="image/*">
  </div>

  <div class="field">
    <label>Convert To</label>
    <select id="formatSelect">
      <option value="image/png">PNG</option>
      <option value="image/jpeg">JPEG</option>
      <option value="image/webp">WebP</option>
    </select>
  </div>

<button id="convertBtn">Convert & Download</button>

  <script src="script.js"></script>

</body>
</html>
